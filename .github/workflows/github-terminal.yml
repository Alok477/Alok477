name: Generate GitHub Terminal GIF

on:
  push:
    branches: [main]
    paths:
      - ".github/gifos_settings.toml"
      - "scripts/generate_terminal.py"
      - ".github/workflows/github-terminal.yml"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install github-readme-terminal
        run: python -m pip install --upgrade github-readme-terminal

      - name: Generate terminal GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_terminal.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.gif
          if git diff --cached --quiet; then
            echo "No GIF changes."
            exit 0
          fi
          git commit -m "chore: update github terminal"
          git push
