name: Generate GitHub Terminal GIF

on:
  push:
    branches:
      - main
    paths:
      - ".github/gifos_settings.toml"
      - "scripts/generate_terminal.py"
      - ".github/workflows/github-terminal.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install github-readme-terminal
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade github-readme-terminal

      - name: Check installation
        run: |
          python --version
          ffmpeg -version
          python -c "import gifos; print('gifos:', gifos.__file__)"

      - name: Generate terminal GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          python scripts/generate_terminal.py

      - name: Verify GIF
        run: |
          ls -lah
          test -f output.gif
          file output.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.gif

          if git diff --cached --quiet; then
            echo "No changes to output.gif"
            exit 0
          fi

          git commit -m "chore: update GitHub terminal"
          git push
